name: Build AutoFish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # AutoFish depends on the Windows-only native `keysender` module.
        os: [windows-2022]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build distributables
        run: npm run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoFish-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            独立下载安装包（Setup.exe）和免安装包（zip），不需要下载 Actions 里的完整合集。

            无限服 / WoW Forever 配置已包含在此版本中。客户端 1.60.1.70862 的浮漂识别和收竿尚未实机验证，此版本不表示该客户端已实测兼容。

            安装包安装后运行 AutoFish Premium.exe。zip 解压后直接运行 AutoFish Premium.exe。游戏档选择 WoW Forever。默认钓鱼键是 1，停止键是 delete。若未找到游戏窗口，到 Advanced Settings 使用 Custom Window。
        run: |
          setup=()
          while IFS= read -r -d '' file; do
            setup+=("$file")
          done < <(find release-assets -type f -name '*Setup.exe' -print0)
          portable=()
          while IFS= read -r -d '' file; do
            portable+=("$file")
          done < <(find release-assets -type f -name '*-win32-x64-*.zip' -print0)
          if [ "${#setup[@]}" -ne 1 ] || [ "${#portable[@]}" -ne 1 ]; then
            echo "Expected one Setup.exe and one portable zip."
            find release-assets -type f -print
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${setup[0]}" "${portable[0]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$RELEASE_NOTES" \
            --repo "$GITHUB_REPOSITORY"
